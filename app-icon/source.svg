<?xml version="1.0" encoding="utf-8"?>
<!--
  Canonical nullx11-OC Android launcher icon source.

  A geometric N mark and terminal cursor use a high-contrast midnight/teal
  palette for clearer recognition at small launcher sizes.

  This SVG feeds scripts/sync-app-icon.mjs (npm run app-icon:sync) and the
  flattened store rasters (npm run app-icon:sync-store).
  See docs/design-system/app-icon.md.

  Layers (by fill):
    #45E0C1  N-shaped primary mark
    #F1ECEC  cursor square accent
  The generator splits those fills into Icon Composer layers.

  Coordinate space mirrors the Android adaptive-icon foreground vector:
  - viewBox 0 0 240 300 (Android viewport, non-uniformly squashed to a square)
  - background rect is the launcher background color
  - glyph group carries the same scale/translate as ic_launcher_foreground.xml
  - scaleY/scaleX = 1.25 aspect-compensates the 240x300 viewport so the
    240-square design is uniform on 108dp
  - scaled 0.88 about the 108dp canvas center so circular Android masks keep
    a black margin; iOS/store keep the previous size via IOS_GLYPH_SCALE
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 240 300">
  <!-- @opencode/background -->
  <rect x="0" y="0" width="240" height="300" fill="#090D18"/>
  <!-- @opencode/glyph: a bold nullx11 N mark with a terminal cursor accent. -->
  <g transform="translate(14.4,18) scale(0.88,1.1)">
    <path d="M 46 40 H 82 L 158 120 V 40 H 194 V 200 H 158 L 82 120 V 200 H 46 Z" fill="#45E0C1"/>
    <path d="M 162 158 H 188 V 184 H 162 Z" fill="#F1ECEC"/>
  </g>
</svg>
